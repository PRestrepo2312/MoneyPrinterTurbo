# docker-compose para Coolify (VPS Hostinger srv1574889, 7.8 GB RAM compartidos
# con Coolify + App Gastos + Resia). Tuneado para NO matar producción:
#   - Solo el servicio webui (la API queda fuera para ahorrar RAM)
#   - Límites duros de CPU/RAM
#   - Flags de Streamlit compatibles con proxy inverso (Traefik de Coolify)
#
# Persistencia (configurar en Coolify -> Storages, NO aquí):
#   - File mount : /MoneyPrinterTurbo/config.toml   (contenido = config.resia.toml, con las keys)
#   - Volume     : /MoneyPrinterTurbo/storage       (videos generados + cache de clips)
#
# Auth: el WebUI NO tiene login. Protégelo a nivel de red (ver RESIA_DEPLOY.md).

services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "moneyprinterturbo-webui"
    # Las keys llegan como Environment Variables de Coolify y se inyectan al
    # config.toml en el arranque (así no van en git ni quedan en la UI pública).
    environment:
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
      - PEXELS_API_KEY=${PEXELS_API_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cp -f config.resia.toml config.toml
        if [ -n "$$CEREBRAS_API_KEY" ]; then
          sed -i "s|^openai_api_key = .*|openai_api_key = \"$$CEREBRAS_API_KEY\"|" config.toml
        fi
        if [ -n "$$PEXELS_API_KEY" ]; then
          sed -i "s|^pexels_api_keys = .*|pexels_api_keys = [\"$$PEXELS_API_KEY\"]|" config.toml
        fi
        exec streamlit run ./webui/Main.py \
          --server.address=0.0.0.0 \
          --server.port=8501 \
          --server.headless=true \
          --server.enableCORS=false \
          --server.enableXsrfProtection=false \
          --browser.gatherUsageStats=false
    ports:
      - "8501"
    restart: unless-stopped
    volumes:
      # Persiste los videos generados + cache de clips entre deploys.
      - mpt-storage:/MoneyPrinterTurbo/storage
    deploy:
      resources:
        limits:
          # Camisa de fuerza: máximo 1.5 cores y 3 GB para no asfixiar a Resia/Gastos.
          # El render será más lento, pero la producción no se cae.
          cpus: "1.5"
          memory: 3g
        reservations:
          memory: 512m

volumes:
  mpt-storage:
